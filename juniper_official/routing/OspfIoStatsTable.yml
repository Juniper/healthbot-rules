---
OspfIoStatsTable:
  rpc: get-ospf-io-statistics-information
  command: /usr/sbin/cli -c 'show ospf io-statistics | display xml | save /tmp/insights-ospf-io-stats.xml'
  item: ospf-io-statistics
  key: Null
  view: ospfioview
  compress: True
  responseFilePath: /tmp/insights-ospf-io-stats.xml

ospfioview:
  fields:
    packets-read: packets-read
    ospf-error: ospf-errors/no-interface-error

FilterQuery:
  Fields:
    - XPath: "rpc-reply/ospf-io-statistics-information/ospf-io-statistics/packets-read"
    - XPath: "rpc-reply/ospf-io-statistics-information/ospf-io-statistics/ospf-errors/no-interface-error"

xslt: "<xsl:stylesheet version=\"1.0\"
 xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"
 xmlns:ns=\"some:ns\">
 <xsl:output omit-xml-declaration=\"yes\" indent=\"yes\"/>
 <xsl:strip-space elements=\"*\"/>
 <ns:WhiteList>
      <name>packets-read</name>
      <name>no-interface-error</name>
 </ns:WhiteList>
 <ns:blacklist>
 </ns:blacklist>
 <xsl:template match=\"node()|@*\">
      <xsl:copy>
             <xsl:apply-templates select=\"node()|@*\"/>
      </xsl:copy>
 </xsl:template>
 <xsl:template match=
  \"*[not(descendant-or-self::*[name()=document('')/*/ns:WhiteList/*]) or (self::*[name()=document('')/*/ns:blacklist/*])]\"/>
 </xsl:stylesheet>"
